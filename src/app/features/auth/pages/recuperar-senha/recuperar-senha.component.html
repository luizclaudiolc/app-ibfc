<div class="min-vh-100 flex items-center justify-center bg-slate-100 px-4 py-12">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6">
    <div class="text-center mb-6">
      <h3 class="text-2xl font-bold text-slate-800 tracking-tight">Recuperar Senha</h3>
      <p class="text-slate-500 text-sm mt-0.5">Digite seu e-mail para receber as instruções.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviarLink()" class="flex flex-col gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>E-mail cadastrado</mat-label>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="exemplo@email.com"
          [readonly]="carregando()"
        />
        @if (form.controls.email.hasError('required')) {
          <mat-error>O e-mail é obrigatório.</mat-error>
        }
      </mat-form-field>

      <button
        mat-flat-button
        type="submit"
        class="w-full !rounded-xl !h-12 !text-sm !font-bold !bg-sky-600 hover:!bg-sky-700 !text-white"
        [disabled]="carregando() || form.invalid"
      >
        @if (carregando()) {
          <mat-spinner diameter="20" class="stroke-white inline-block mr-2"></mat-spinner>
        }
        {{ carregando() ? 'Enviando...' : 'Enviar Link de Recuperação' }}
      </button>

      <div class="text-center mt-4">
        <a routerLink="/login" class="text-xs font-semibold text-sky-600 hover:text-sky-700">
          Voltar para o Login
        </a>
      </div>
    </form>
  </div>
</div>
