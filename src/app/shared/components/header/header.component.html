<header
  class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 transition-all"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-2xl bg-white border border-slate-100 flex items-center justify-center overflow-hidden shadow-sm shrink-0"
      >
        <img
          src="img/logo-ibfc-dark.jpg"
          alt="Logo da Igreja"
          class="w-full h-full object-cover"
          (error)="
            $any($event.target).style.display = 'none';
            $any($event.target).nextElementSibling.style.display = 'flex'
          "
        />

        <div
          class="w-full h-full bg-gradient-to-br from-sky-500 to-indigo-600 text-white items-center justify-center text-lg hidden"
        >
          ⛪
        </div>
      </div>

      <div class="flex flex-col">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 leading-none">
          Bem-vindo(a)
        </span>
        <h1
          class="text-sm font-bold text-slate-800 tracking-tight mt-0.5 truncate max-w-[140px] sm:max-w-xs"
        >
          {{ nomeUsuario().split(' ')[0] }} {{ nomeUsuario().split(' ')[1] || '' }}
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="irParaperfil()"
        class="relative group rounded-full p-0.5 focus:outline-none focus:ring-2 focus:ring-sky-500/40 transition-all"
        title="Meu Perfil"
      >
        @if (fotoUsuario()) {
          <img
            [src]="fotoUsuario()"
            class="w-10 h-10 rounded-full object-cover ring-2 ring-slate-100 shadow-sm group-hover:scale-105 transition-transform"
            alt="Foto de Perfil"
          />
        } @else {
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-slate-100 to-slate-200 text-slate-600 font-bold flex items-center justify-center text-xs ring-2 ring-slate-100 shadow-sm group-hover:scale-105 transition-transform"
          >
            {{ nomeUsuario().charAt(0).toUpperCase() }}
          </div>
        }
      </button>
    </div>
  </div>
</header>
