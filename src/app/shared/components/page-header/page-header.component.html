<div
  class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 relative overflow-hidden mb-4"
>
  <div
    class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-sky-500/10 to-indigo-500/15 pointer-events-none"
  ></div>

  <div class="relative z-10 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">{{ titulo() }}</h1>
      @if (subtitulo()) {
        <p class="text-xs text-slate-500 font-medium mt-0.5">
          {{ subtitulo() }}
        </p>
      }
    </div>

    @if (icone()) {
      <div
        class="w-10 h-10 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center font-bold shadow-sm shrink-0 ml-4"
      >
        <mat-icon>{{ icone() }}</mat-icon>
      </div>
    }
  </div>

  <div class="relative w-full z-10 mt-4 empty:hidden">
    <ng-content></ng-content>
  </div>
</div>
