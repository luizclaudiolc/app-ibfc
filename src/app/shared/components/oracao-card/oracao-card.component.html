<div
  class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-4 transition-all hover:shadow-md"
>
  <a
    [routerLink]="['/dashboard/perfil', membroLocal().id]"
    class="flex items-center gap-3 mb-3 cursor-pointer group decoration-transparent"
  >
    @if (membroLocal().foto_url) {
      <img
        [src]="membroLocal().foto_url"
        class="w-10 h-10 rounded-full object-cover ring-2 ring-slate-50 group-hover:ring-sky-100 transition-all"
      />
    } @else {
      <div
        class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center text-sm ring-2 ring-slate-50 group-hover:ring-sky-100 transition-all"
      >
        {{ membroLocal().nome[0].toUpperCase() }}
      </div>
    }
    <div>
      <h3 class="text-sm font-bold text-slate-800 group-hover:text-sky-600 transition-colors">
        {{ membroLocal().nome }} {{ membroLocal().sobrenome }}
      </h3>
      <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">
        Precisa de oração
      </p>
    </div>
  </a>

  <div class="bg-slate-50/50 rounded-2xl p-4 border border-slate-100 mb-4 relative">
    <mat-icon class="absolute top-3 left-3 text-slate-200 !w-6 !h-6 !text-[24px] rotate-180"
      >format_quote</mat-icon
    >
    <p class="text-sm font-medium text-slate-600 leading-relaxed italic relative z-10 pl-6">
      {{ membroLocal().pedido_oracao }}
    </p>
  </div>

  <div class="flex items-center justify-between">
    <span class="text-xs font-semibold text-slate-500 flex items-center gap-1.5">
      <mat-icon class="!w-[16px] !h-[16px] !text-[16px] text-amber-500"
        >local_fire_department</mat-icon
      >
      <strong>{{ membroLocal().total_oracoes || 0 }}</strong> intercessores
    </span>

    <button
      type="button"
      (click)="orarPorMembro()"
      [disabled]="jaOrou() || carregando()"
      class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm active:scale-95"
      [ngClass]="
        jaOrou()
          ? 'bg-emerald-500 text-white cursor-default'
          : 'bg-white hover:bg-sky-50 text-sky-600 border border-sky-200'
      "
    >
      @if (carregando()) {
        <mat-spinner diameter="16" class="!text-current"></mat-spinner>
      } @else {
        <mat-icon class="!w-[16px] !h-[16px] !text-[16px] !leading-none overflow-visible">
          {{ jaOrou() ? 'check' : 'favorite_border' }}
        </mat-icon>
        <span class="pt-[1px]">{{ jaOrou() ? 'Estou Orando' : 'Orar' }}</span>
      }
    </button>
  </div>
</div>
