<footer
  class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 px-2 py-2 flex justify-around items-center max-w-xl mx-auto pb-safe"
>
  @for (item of visibleItems(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-sky-600 opacity-100"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      class="flex flex-col items-center gap-0.5 focus:outline-none text-slate-400 opacity-50 transition-all w-16 hover:opacity-80"
    >
      <span class="text-[22px] leading-tight">{{ item.icon }}</span>
      <span class="text-[10px] font-bold tracking-wide">{{ item.label }}</span>
    </a>
  }

  <button
    [matMenuTriggerFor]="footerMenu"
    (menuOpened)="menuAberto.set(true)"
    (menuClosed)="menuAberto.set(false)"
    class="flex flex-col items-center gap-0.5 focus:outline-none text-slate-400 opacity-50 transition-all w-16 hover:opacity-100"
  >
    <mat-icon
      class="!w-6 !h-6 text-[24px] transition-transform duration-300 transform"
      [ngClass]="menuAberto() ? 'rotate-90 scale-110 text-sky-600' : 'rotate-0'"
    >
      {{ menuAberto() ? 'close' : 'menu' }}
    </mat-icon>
    <span class="text-[10px] font-bold tracking-wide" [ngClass]="menuAberto() ? 'text-sky-600' : ''"
      >Menu</span
    >
  </button>
</footer>

<mat-menu #footerMenu="matMenu" yPosition="above" class="rounded-2xl mb-2">
  @for (overflow of overflowItems(); track overflow.route) {
    <a mat-menu-item [routerLink]="overflow.route">
      <span class="mr-3 text-lg">{{ overflow.icon }}</span>
      <span class="font-medium text-slate-700">{{ overflow.label }}</span>
    </a>
  }

  @if (overflowItems().length > 0) {
    <mat-divider class="my-1"></mat-divider>
  }

  <button mat-menu-item (click)="efetuarLogout()" class="hover:bg-red-50">
    <mat-icon class="!text-red-500 mr-2">logout</mat-icon>
    <span class="font-bold text-red-500">Sair</span>
  </button>
</mat-menu>
