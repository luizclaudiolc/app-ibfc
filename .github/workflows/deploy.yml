name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Criar arquivo de environment de produção
        run: |
          mkdir -p src/environments
          echo "export const environment = {" > src/environments/environments.prod.ts
          echo "  production: true," >> src/environments/environments.prod.ts
          echo "  supabaseUrl: '${{ secrets.SUPABASEURL }}'," >> src/environments/environments.prod.ts
          echo "  supabaseKey: '${{ secrets.SUPABASEKEY }}'" >> src/environments/environments.prod.ts
          echo "};" >> src/environments/environments.prod.ts

      - name: Build Angular App
        run: npx ng build --configuration production --base-href "/app-ibfc/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/app-ibfc
