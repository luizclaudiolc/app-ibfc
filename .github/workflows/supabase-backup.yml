name: Backup semanal Supabase

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas
        run: |
          aws --version
          gpg --version
          docker pull postgres:17

      - name: Dump do banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/backup"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backup:/backup" \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl --schema=public --schema=auth -F p -f /backup/db.sql'
          gzip -9 "$GITHUB_WORKSPACE/backup/db.sql"

      - name: Copiar Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          ENDPOINT: https://${{ secrets.SUPABASE_PROJECT_REF }}.storage.supabase.co/storage/v1/s3
        run: |
          set -euo pipefail
          mkdir -p backup/storage
          aws s3 sync s3://fotos_membros backup/storage/fotos_membros --endpoint-url "$ENDPOINT"
          aws s3 sync s3://avisos backup/storage/avisos --endpoint-url "$ENDPOINT"
          tar -C backup -czf backup/storage.tar.gz storage
          rm -rf backup/storage

      - name: Criptografar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 backup/db.sql.gz
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 backup/storage.tar.gz
          rm -f backup/db.sql.gz backup/storage.tar.gz
          ls -lh backup/

      - name: Guardar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ibfc-backup-${{ github.run_id }}
          path: backup/*.gpg
          retention-days: 90
