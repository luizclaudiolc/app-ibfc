name: Supabase keep-alive

on:
  schedule:
    # Todo dia às 12:00 UTC (9:00 em Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Postgres via REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # SELECT conta como query de usuário
          curl -fsS \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id,last_ping&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"

          # UPDATE deixa rastro visível no dashboard
          curl -fsS -X PATCH \
            "${SUPABASE_URL}/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          echo "Keep-alive ok"
